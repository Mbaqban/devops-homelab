---
# Everything in one file. Put it next to env.yml and run:
#   ansible-playbook k8s-cluster-all-in-one.yml
#
# 1. reads env.yml and writes inventory.ini (also loads the hosts in memory)
# 2. prepares the nodes, runs kubeadm init on the first master (kube-vip + Flannel)
# 3. joins the other masters (one by one), then the workers
# Assumes kubeadm, kubelet, kubectl and a container runtime are already installed.

# ---------------------------------------------------------------------------
- name: Read env.yml, create inventory.ini and load the hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - /home/mbaqban/Projects/env/nodes.yaml
  vars:
    ssh_user: vagrant
    ssh_private_key: /home/mbaqban/.ssh/id_ed25519
    masters: "{{ nodes | selectattr('master') | list }}"
    workers: "{{ nodes | rejectattr('master') | list }}"
  tasks:
    - name: Make sure there is at least one master
      ansible.builtin.assert:
        that: masters | length > 0
        fail_msg: "env.yml needs at least one node with master: true"

    - name: Write inventory.ini
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/inventory.ini"
        mode: "0644"
        content: |
          # Generated from env.yml - do not edit by hand

          [first_master]
          {{ masters[0].name }} ansible_host={{ masters[0].ip }} node_ip={{ masters[0].ip }}

          [other_masters]
          {% for n in masters[1:] %}
          {{ n.name }} ansible_host={{ n.ip }} node_ip={{ n.ip }}
          {% endfor %}

          [masters:children]
          first_master
          other_masters

          [workers]
          {% for n in workers %}
          {{ n.name }} ansible_host={{ n.ip }} node_ip={{ n.ip }}
          {% endfor %}

          [k8s:children]
          masters
          workers

          [k8s:vars]
          ansible_user={{ ssh_user }}
          ansible_ssh_private_key_file={{ ssh_private_key }}
          ansible_become=true
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'

    - name: Load first master into the running inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: [k8s, masters, first_master]
        ansible_host: "{{ item.ip }}"
        node_ip: "{{ item.ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_become: true
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      loop: "{{ masters[:1] }}"

    - name: Load other masters into the running inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: [k8s, masters, other_masters]
        ansible_host: "{{ item.ip }}"
        node_ip: "{{ item.ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_become: true
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      loop: "{{ masters[1:] }}"

    - name: Load workers into the running inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: [k8s, workers]
        ansible_host: "{{ item.ip }}"
        node_ip: "{{ item.ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_become: true
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      loop: "{{ workers }}"

# ---------------------------------------------------------------------------
- name: Prepare all nodes
  hosts: k8s
  become: true
  gather_facts: true
  vars_files:
    - /home/mbaqban/Projects/env/nodes.yaml
  tasks:
    - name: Detect the interface that carries this node's IP
      ansible.builtin.set_fact:
        node_iface: >-
          {{ ansible_facts.interfaces
             | map('regex_replace', '[-.]', '_')
             | map('extract', ansible_facts)
             | selectattr('ipv4', 'defined')
             | selectattr('ipv4.address', 'equalto', node_ip)
             | map(attribute='device')
             | first }}

    - name: Pin kubelet to the node IP (avoids picking the NAT NIC)
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
        mode: "0644"

      
# ---------------------------------------------------------------------------
- name: Create containerd CNI binary directory
  hosts: k8s
  become: true
  tasks:
    # your existing preparation tasks...

    - name: Create containerd CNI binary directory
      ansible.builtin.file:
        path: /usr/lib/cni
        state: directory
        mode: "0755"

    - name: Link CNI plugins for containerd
      ansible.builtin.shell:
        cmd: "ln -sf /opt/cni/bin/* /usr/lib/cni/"
      changed_when: false

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

# ---------------------------------------------------------------------------
- name: Bootstrap the first control-plane node
  hosts: first_master
  become: true
  vars_files:
    - /home/mbaqban/Projects/env/nodes.yaml
  vars:
    # kube-vip static pod; kube_vip_kubeconfig is set per task below
    control_plane_endpoint: "192.168.56.20:6443"
    kube_vip_manifest: &kube_vip_manifest |
      apiVersion: v1
      kind: Pod
      metadata:
        name: kube-vip
        namespace: kube-system
      spec:
        containers:
          - name: kube-vip
            image: ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
            imagePullPolicy: IfNotPresent
            args:
              - manager
            env:
              - name: vip_arp
                value: "true"
              - name: port
                value: "{{ control_plane_endpoint.split(':')[1] }}"
              - name: vip_nodename
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: vip_interface
                value: "{{ node_iface }}"
              - name: vip_subnet
                value: "32"
              - name: dns_mode
                value: first
              - name: cp_enable
                value: "true"
              - name: cp_namespace
                value: kube-system
              - name: vip_leaderelection
                value: "true"
              - name: vip_leasename
                value: plndr-cp-lock
              - name: vip_leaseduration
                value: "5"
              - name: vip_renewdeadline
                value: "3"
              - name: vip_retryperiod
                value: "1"
              - name: address
                value: "{{ control_plane_endpoint.split(':')[0] }}"
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
            volumeMounts:
              - mountPath: /etc/kubernetes/admin.conf
                name: kubeconfig
        hostAliases:
          - hostnames:
              - kubernetes
            ip: 127.0.0.1
        hostNetwork: true
        volumes:
          - name: kubeconfig
            hostPath:
              path: {{ kube_vip_kubeconfig }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Check whether the cluster is already initialised
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Ensure the static pod manifest directory exists
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: "0755"

    # Since k8s 1.29 kubeadm creates super-admin.conf; kube-vip needs it
    # during init because admin.conf has no RBAC rights until init finishes.
    - name: Install kube-vip static pod (bootstrap kubeconfig)
      ansible.builtin.copy:
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        content: "{{ kube_vip_manifest }}"
        mode: "0600"
      vars:
        kube_vip_kubeconfig: /etc/kubernetes/super-admin.conf
      when: not admin_conf.stat.exists

    - name: kubeadm init
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --control-plane-endpoint {{ control_plane_endpoint }}
          --apiserver-advertise-address {{ node_ip }}
          --pod-network-cidr {{ pod_cidr }}
          --node-name {{ inventory_hostname }}
          --ignore-preflight-errors=DirAvailable--etc-kubernetes-manifests
        creates: /etc/kubernetes/admin.conf

    - name: Switch kube-vip to the regular admin.conf
      ansible.builtin.copy:
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        content: "{{ kube_vip_manifest }}"
        mode: "0600"
      vars:
        kube_vip_kubeconfig: /etc/kubernetes/admin.conf

    # kubelet restarts kube-vip after the manifest switch, which drops the VIP
    # for a moment. Require ~45s of uninterrupted API access through the VIP.
    - name: Wait until the API is stable behind the VIP
      ansible.builtin.shell: |
        for i in $(seq 1 9); do
          kubectl get --raw /readyz >/dev/null 2>&1 || exit 1
          sleep 5
        done
      args:
        executable: /bin/bash
      register: vip_stable
      until: vip_stable.rc == 0
      retries: 20
      delay: 10
      changed_when: false

    - name: Download the Flannel manifest
      ansible.builtin.get_url:
        url: "{{ flannel_manifest_url }}"
        dest: /tmp/kube-flannel.yml
        force: true
        mode: "0644"

    - name: Make Flannel use the node-IP interface
      ansible.builtin.replace:
        path: /tmp/kube-flannel.yml
        regexp: '^(\s*)- --kube-subnet-mgr$'
        replace: '\1- --kube-subnet-mgr\n\1- --iface={{ flannel_iface | default(node_iface) }}'

    - name: Match Flannel's network to pod_cidr
      ansible.builtin.replace:
        path: /tmp/kube-flannel.yml
        regexp: '"Network": "[0-9./]+"'
        replace: '"Network": "{{ pod_cidr }}"'

    - name: Apply Flannel
      ansible.builtin.command: kubectl apply -f /tmp/kube-flannel.yml
      register: flannel
      until: flannel.rc == 0
      retries: 5
      delay: 10
      changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

    - name: Create a fresh join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Force join command to use the Kubernetes VIP
      ansible.builtin.set_fact:
        join_command: >-
          {{ join_cmd.stdout
            | regex_replace(
                '^kubeadm join \S+',
                'kubeadm join ' ~ control_plane_endpoint
              ) }}

    - name: Create kubeadm config for upload-certs
      ansible.builtin.copy:
        dest: /tmp/kubeadm-upload-certs.yaml
        mode: "0600"
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "{{ node_ip }}"
            bindPort: 6443
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          controlPlaneEndpoint: "{{ control_plane_endpoint }}"
          
    - name: Upload control-plane certs and get the certificate key
      ansible.builtin.command:
        cmd: >-
          kubeadm init phase upload-certs
          --upload-certs
          --config /tmp/kubeadm-upload-certs.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_out
      changed_when: false

    - name: Keep join data for the other nodes
      ansible.builtin.set_fact:
        certificate_key: "{{ cert_out.stdout_lines | last }}"

    - name: Copy admin.conf to the controller
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/admin.conf"
        flat: true

# ---------------------------------------------------------------------------
- name: Join the remaining control-plane nodes (one at a time)
  hosts: other_masters
  become: true
  serial: 1
  vars_files:
    - /home/mbaqban/Projects/env/nodes.yaml
  vars:
    first: "{{ groups['first_master'][0] }}"
    kube_vip_manifest: *kube_vip_manifest
  tasks:
    - name: kubeadm join --control-plane
      ansible.builtin.command:
        cmd: >-
          {{ hostvars[first].join_command }}
          --control-plane
          --certificate-key {{ hostvars[first].certificate_key }}
          --apiserver-advertise-address {{ node_ip }}
          --node-name {{ inventory_hostname }}
        creates: /etc/kubernetes/kubelet.conf

    - name: Install kube-vip static pod (after join, VIP is already held)
      ansible.builtin.copy:
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        content: "{{ kube_vip_manifest }}"
        mode: "0600"
      vars:
        kube_vip_kubeconfig: /etc/kubernetes/admin.conf

# ---------------------------------------------------------------------------
- name: Join the workers
  hosts: workers
  become: true
  vars:
    first: "{{ groups['first_master'][0] }}"
  tasks:
    - name: kubeadm join
      ansible.builtin.command:
        cmd: >-
          {{ hostvars[first].join_command }}
          --node-name {{ inventory_hostname }}
        creates: /etc/kubernetes/kubelet.conf

# ---------------------------------------------------------------------------
- name: Verify the cluster
  hosts: first_master
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false

    - name: List nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes_out.stdout_lines