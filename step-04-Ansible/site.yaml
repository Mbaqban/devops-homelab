- name: Build dynamic inventory from nodes.yml
  hosts: localhost
  gather_facts: false
  vars_files:
    - /home/mbaqban/projects/KVMTEST/proj/env/nodes.yaml
  tasks:
    - name: Add master
      add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        groups: master
      loop: "{{ nodes }}"
      when: item.master

    - name: Add workers
      add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        groups: workers
      loop: "{{ nodes }}"
      when: not item.master

- name: Initialize control-plane
  hosts: master
  become: true
  vars:
    pod_cidr: "10.244.0.0/16"
  tasks:
    - name: kubeadm init
      command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_host }}
        --pod-network-cidr={{ pod_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Create .kube dir for current user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        mode: '0600'

    - name: Install Flannel CNI
      become_user: "{{ ansible_user }}"
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      changed_when: false

    - name: Generate join command
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Save join command as fact
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"

- name: Join worker nodes
  hosts: workers
  become: true
  tasks:
    - name: kubeadm join
      command: "{{ hostvars[groups['master'][0]].join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
